<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View the books in your collection.">
    <title>Book Library | Your Books</title>
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/styles.css') }}"
    >
    <script
        src="{{ url_for('static', path='/js/books.js') }}"
        defer
    ></script>
</head>
<body>
    <main class="page-container">
        <section class="book-card library-card" aria-labelledby="page-title">
            <div class="brand">
                <span class="brand-icon" aria-hidden="true">B</span>
                <span>Book Library</span>
            </div>

            <header class="card-header">
                <p class="eyebrow">YOUR PERSONAL COLLECTION</p>
                <h1 id="page-title">Your books</h1>
                <p class="subtitle">Select a book to view its details.</p>
            </header>

            <p id="library-status" class="library-status" role="status" aria-live="polite">
                Loading books...
            </p>
            <ul id="book-list" class="book-list" aria-label="Books"></ul>

            <section
                id="book-details"
                class="book-details"
                aria-labelledby="selected-book-title"
                hidden
            >
                <p class="eyebrow">SELECTED BOOK</p>
                <h2 id="selected-book-title"></h2>
                <p id="selected-book-author" class="subtitle"></p>
                <p id="selected-book-id" class="book-id"></p>

                <form id="edit-book-form">
                    <div class="form-group">
                        <label for="edit-title">Book title</label>
                        <input
                            type="text"
                            id="edit-title"
                            name="title"
                            maxlength="200"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="edit-author">Author</label>
                        <input
                            type="text"
                            id="edit-author"
                            name="author"
                            maxlength="120"
                            required
                        >
                    </div>

                    <button type="submit">Save changes</button>
                </form>
            </section>

            <footer class="card-footer">
                <a href="/add-book">Add another book</a>
            </footer>
        </section>
    </main>
</body>
</html>
