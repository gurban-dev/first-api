
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Add books to your personal book collection."
    >

    <title>Book Library | Add a Book</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/styles.css') }}"
    >

    <script
        src="{{ url_for('static', path='/js/app.js') }}"
        defer
    ></script>
</head>

<body>
    <main class="page-container">
        <section class="book-card" aria-labelledby="page-title">

            <div class="brand">
                <span class="brand-icon" aria-hidden="true">B</span>
                <span>Book Library</span>
            </div>

            <header class="card-header">
                <p class="eyebrow">YOUR PERSONAL COLLECTION</p>

                <h1 id="page-title">Add a new book</h1>

                <p class="subtitle">
                    Keep track of the books you want to read
                    or have already discovered.
                </p>
            </header>

            <form id="book-form">

                <div class="form-group">
                    <label for="title">Book title</label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="e.g. The Great Gatsby"
                        maxlength="200"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="author">Author</label>

                    <input
                        type="text"
                        id="author"
                        name="author"
                        placeholder="e.g. F. Scott Fitzgerald"
                        maxlength="120"
                        autocomplete="off"
                        required
                    >
                </div>

                <button type="submit" id="submit-button">
                    <span id="button-text">Add book</span>
                    <span id="button-spinner" class="spinner"
                          hidden aria-hidden="true"></span>
                </button>

            </form>

            <div
                id="feedback"
                class="feedback"
                role="status"
                aria-live="polite"
                aria-atomic="true"
                hidden
            ></div>

            <footer class="card-footer">
                Powered by FastAPI
            </footer>

        </section>
    </main>
</body>
</html>
