<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update a Book</title>
</head>
<body>
    <main>
        <h1>Update a Book</h1>
        <p id="status" role="status" aria-live="polite">Loading books...</p>
        <ul id="book-list" aria-label="Available books"></ul>

        <section aria-labelledby="form-heading">
            <h2 id="form-heading">Update one book field</h2>
            <p id="selected-book">Select a book to begin.</p>

            <form id="update-book-form">
                <label for="field">Field to update</label>
                <select id="field" required disabled>
                    <option value="title">Title</option>
                    <option value="author">Author</option>
                </select>

                <label id="value-label" for="new-value">New title</label>
                <input type="text" id="new-value" required disabled>
                <button type="submit" disabled>Send PATCH request</button>
            </form>
        </section>

        <h2>Server response</h2>
        <pre id="response" aria-live="polite"></pre>
    </main>

    <script>
        const bookList = document.getElementById("book-list");
        const form = document.getElementById("update-book-form");
        const fieldSelect = document.getElementById("field");
        const valueLabel = document.getElementById("value-label");
        const valueInput = document.getElementById("new-value");
        const submitButton = form.querySelector("button");
        const selectedBookMessage = document.getElementById("selected-book");
        const statusMessage = document.getElementById("status");
        const responseElement = document.getElementById("response");

        let selectedBook = null;

        function updateFieldLabel() {
            const fieldName = fieldSelect.value;
            const displayName = fieldName === "title" ? "title" : "author";
            valueLabel.textContent = `New ${displayName}`;
            valueInput.value = "";
            valueInput.maxLength = fieldName === "title" ? 200 : 120;
            valueInput.placeholder = `Enter a new ${displayName}`;
        }

        fieldSelect.addEventListener("change", updateFieldLabel);

        async function loadBooks() {
            const response = await fetch("/api/books");

            if (!response.ok) {
                throw new Error(`Could not load books (${response.status}).`);
            }

            const books = await response.json();
            bookList.replaceChildren();

            if (books.length === 0) {
                statusMessage.textContent = "There are no books to update.";
                return;
            }

            statusMessage.textContent = "Click a book to select it.";

            for (const book of books) {
                const item = document.createElement("li");
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = `${book.title} by ${book.author}`;
                button.addEventListener("click", () => {
                    selectedBook = book;
                    selectedBookMessage.textContent =
                        `Selected: ${book.title} (ID: ${book.id})`;
                    fieldSelect.disabled = false;
                    valueInput.disabled = false;
                    submitButton.disabled = false;
                    updateFieldLabel();
                    responseElement.textContent = "";
                });

                item.append(button);
                bookList.append(item);
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (selectedBook === null) {
                responseElement.textContent = "Select a book first.";
                return;
            }

            const field = fieldSelect.value;
            const value = valueInput.value.trim();

            if (!value) {
                responseElement.textContent = `Enter a new ${field}.`;
                return;
            }

            try {
                const response = await fetch(`/books/${selectedBook.id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ [field]: value })
                });

                const data = await response.json();
                responseElement.textContent = JSON.stringify(data, null, 2);

                if (!response.ok) {
                    throw new Error(data.detail || `Update failed (${response.status}).`);
                }

                selectedBook = data;
                selectedBookMessage.textContent =
                    `Selected: ${data.title} (ID: ${data.id})`;
                await loadBooks();
                statusMessage.textContent = `${field} updated successfully.`;
            } catch (error) {
                responseElement.textContent = error.message;
            }
        });

        loadBooks().catch((error) => {
            statusMessage.textContent = error.message;
        });
    </script>
</body>
</html>
